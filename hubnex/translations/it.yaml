configuration:
  anthropic_api_key:
    name: Chiave API Anthropic
    description: La chiave per usare Claude (console.anthropic.com). Non serve se usi solo altri fornitori.
  model_jarvis:
    name: Modello di Jarvis
    description: Usato da Jarvis e dagli agenti che non ne indicano uno in agents.yaml. Claude per nome (claude-sonnet-5-5), gli altri con il prefisso del fornitore - openai:gpt-5-mini, ollama:qwen3:14b, compat:nome-modello.
  model_mail:
    name: Modello di Jarvis Mail
    description: Usato dall'agente email e per classificare la posta.
  model_voice:
    name: Modello per i comandi rapidi
    description: La via rapida per le richieste sulla casa (dashboard e Assist). Haiku è il più veloce; le domande complesse passano comunque al modello di Jarvis. Vuoto = niente via rapida.
  anthropic_credit_usd:
    name: Credito Anthropic ($)
    description: Il saldo che vedi su console.anthropic.com (es. 4.90). La dashboard scala da qui il costo stimato di ogni richiesta. Quando ricarichi, scrivi il nuovo saldo e il conteggio riparte. 0 = mostra solo la spesa.
  monthly_budget_usd:
    name: Budget mensile Claude ($)
    description: Avviso nel gruppo Telegram e nelle notifiche quando la spesa del mese arriva all'80% e al 100%. È solo un avviso, HubNEX non si ferma. 0 = nessun avviso.
  openai_api_key:
    name: Chiave API OpenAI
    description: Per i modelli scritti come openai:nome (platform.openai.com).
  openai_base_url:
    name: Indirizzo API OpenAI
    description: Vuoto = quello di OpenAI. Cambialo solo per un servizio che imita OpenAI con la stessa chiave.
  ollama_url:
    name: Indirizzo di Ollama
    description: Per i modelli locali scritti come ollama:nome, es. http://192.168.1.20:11434. Gratis e senza cloud; serve un modello che sappia usare gli strumenti (qwen3, llama3.1, mistral-small).
  compat_base_url:
    name: Indirizzo di un altro servizio compatibile
    description: Per i modelli scritti come compat:nome. Qualsiasi server compatibile con OpenAI, fino a /v1 - LM Studio (http://IP:1234/v1), OpenRouter (https://openrouter.ai/api/v1), Gemini (https://generativelanguage.googleapis.com/v1beta/openai), Mistral, DeepSeek, Groq.
  compat_api_key:
    name: Chiave del servizio compatibile
    description: La chiave di quel servizio; vuota se non la chiede (LM Studio).
  other_price_input:
    name: Prezzo input altri modelli ($ per milione di token)
    description: Per contare la spesa dei modelli openai e compat, come da listino del fornitore. 0 = non contata. I modelli di Ollama sono sempre gratis.
  other_price_output:
    name: Prezzo output altri modelli ($ per milione di token)
    description: Come sopra, per i token di risposta.
  telegram_token_jarvis:
    name: Token bot Jarvis
    description: Da @BotFather. Deve essere un bot che nessun altro programma sta ascoltando.
  telegram_token_mail:
    name: Token bot Jarvis Mail
    description: Il secondo bot del gruppo, quello che parla per la posta.
  allowed_chat_id:
    name: ID del gruppo
    description: Numero negativo, con il segno meno. Scrivi /id nel gruppo per vederlo.
  allowed_user_id:
    name: Il tuo user ID Telegram
    description: I bot obbediscono solo a te.
  telegram_voice_replies:
    name: Risposte vocali su Telegram
    description: Se mandi un vocale a Jarvis, risponde anche a voce (serve ElevenLabs).
  imap_host:
    name: Server IMAP
  imap_port:
    name: Porta IMAP
  smtp_host:
    name: Server SMTP
  smtp_port:
    name: Porta SMTP
  mail_user:
    name: Casella email
  mail_password:
    name: Password email
  mail_from_name:
    name: Nome mittente
    description: Es. "Ing. Mario Rossi - Azienda srl".
  mail_signature:
    name: Firma
    description: Testo semplice (usa \n per andare a capo) oppure HTML incollato dal tuo programma di posta.
  check_interval_minutes:
    name: Controllo posta (minuti)
  notify_min_priority:
    name: Avvisami da priorità
    description: "laag = bassa, gemiddeld = media, hoog = alta: da quale priorità le nuove email vengono annunciate su Telegram."
  mail_ignore:
    name: Mittenti da non segnalare
    description: Separati da virgola. Un indirizzo (offerte@negozio.it), un dominio (@newsletter.it) o una parola dell'indirizzo (noreply). Le loro email restano nella casella, ma niente messaggio su Telegram.
  hq_token:
    name: Token HQ
    description: Password per aprire la dashboard fuori da HA e per l'API (rest_command). Dalla barra laterale non serve.
  elevenlabs_api_key:
    name: Chiave API ElevenLabs
    description: Per la voce di Jarvis e per trascrivere i tuoi vocali.
  elevenlabs_voice_id:
    name: Voce ElevenLabs
  elevenlabs_model:
    name: Modello ElevenLabs
    description: eleven_flash_v2_5 è il più economico e parla italiano.
  voice_tts_entity:
    name: Voce da Home Assistant
    description: In alternativa a ElevenLabs, un motore di sintesi vocale di Home Assistant (es. tts.piper, gratuito e locale, o tts.home_assistant_cloud). Se impostato, ha la precedenza.
  voice_tts_voice:
    name: Voce del motore di Home Assistant
    description: Il nome della voce da usare con il motore qui sopra, per esempio Rinaldo o Diego per Home Assistant Cloud. Vuoto = la voce predefinita. La lingua è quella di Home Assistant.
  language:
    name: Lingua
    description: "nl = olandese (predefinito); auto = quella di Home Assistant; en = inglese; it = italiano. Usata dall'assistente, dagli agenti, da Telegram e dai messaggi dell'add-on; la plancia segue la lingua di chi la apre. Puoi sceglierla anche nella plancia in Preferenze → Impostazioni."
  voice_answers:
    name: Risposte a voce
    description: "volledig = completa: la voce legge tutta la risposta; samenvatting = riassunto: per le risposte lunghe la voce dice solo il succo in una o due frasi, il testo scritto resta completo."
  ha_blocked_services:
    name: Servizi HA bloccati
    description: Servizi che Jarvis non può mai chiamare da solo, separati da virgola.
  calendar_entities:
    name: Agende consentite
    description: Entity id separati da virgola (es. calendar.nico, calendar.famiglia) che lo strumento calendar_events può leggere. Vuoto = tutte le agende di Home Assistant. Gli appuntamenti vengono letti dagli agenti a cui dai lo strumento e inviati al fornitore AI.
  install_assist_integration:
    name: Integrazione Assist
    description: Installa e aggiorna l'integrazione che rende Jarvis l'agente di conversazione di Assist (voce da app di HA e speaker).
  non_admin_access:
    name: Utenti non amministratori
    description: "huis = casa: gli utenti di Home Assistant che non sono amministratori ottengono solo la vista della casa (niente assistente, posta, agenti o modifiche alla piantina). volledig = completo: ottengono tutto, come un amministratore."
  chat_history_turns:
    name: "Memoria della conversazione"
    description: "Quanti messaggi precedenti della conversazione Jarvis rilegge a ogni nuovo messaggio."
  chat_voice_history_turns:
    name: "Memoria della conversazione Assist"
    description: "Lo stesso per Assist (voce): una memoria breve lo mantiene veloce."
  chat_new_session_after_hours:
    name: "Nuova conversazione dopo silenzio (ore)"
    description: "Dopo tante ore senza messaggi, la dashboard o una chat Telegram inizia da sola una nuova conversazione. 0 = mai (iniziane una dall'elenco nella chat o con /new su Telegram)."
  chat_keep_sessions:
    name: "Conversazioni conservate"
    description: "Quante conversazioni restano per canale; le più vecchie vengono dimenticate."
  chat_trash_days:
    name: "Giorni per annullare un'eliminazione"
    description: "Una conversazione eliminata si può recuperare per tanti giorni."
  chat_live_text:
    name: "Risposte in diretta"
    description: "La risposta compare nella chat mentre viene scritta."
  chat_show_tools:
    name: "Mostra i passaggi degli strumenti"
    description: "Conserva e mostra cosa l'assistente ha consultato o fatto per arrivare alla risposta."
  chat_max_parallel:
    name: "Chiamate al modello contemporanee"
    description: "Quante richieste all'AI possono girare insieme. Un posto resta sempre libero per una persona, così le routine non ti fanno mai aspettare."
  ha_mcp_enabled:
    name: "Strumenti Home Assistant (MCP)"
    description: "Gli strumenti Home Assistant integrati, portati da brAIn: dispositivi, aree, automazioni e le loro tracce, fotogrammi delle telecamere e altro, per Jarvis e gli agenti."
  ha_mcp_groups:
    name: "Gruppi di strumenti Home Assistant"
    description: "read (stati, aree, dispositivi, storico), control (luci, clima, serrature… con le regole sotto), automation (configurazioni e tracce), camera (fotogrammi), dashboards (lettura), exposure (cosa raggiungono gli assistenti, come si mostrano le entità), system (log errori, ricarica, eventi)."
  ha_mcp_exclude_tools:
    name: "Strumenti disattivati"
    description: "Singoli strumenti da escludere, separati da virgole (es. render_template,fire_event)."
  ha_mcp_agents:
    name: "Chi riceve gli strumenti Home Assistant"
    description: "Id degli agenti separati da virgole (boss = Jarvis). Vuoto = Jarvis e ogni agente."
  ha_mcp_confirm:
    name: "Conferma per le modifiche"
    description: "writes = gli strumenti che cambiano la casa aspettano il tuo OK (tranne quelli liberi sotto); always = ogni strumento aspetta; never = niente aspetta."
  ha_mcp_free_tools:
    name: "Modifiche senza conferma"
    description: "Strumenti che cambiano la casa ma partono subito, separati da virgole."
  ha_protected_entities:
    name: "Entità protette"
    description: "Entità su cui l'assistente non agisce mai, da nessun canale: entity id o interi domini (lock.porta,alarm_control_panel.*). Si possono comunque guardare."
  ha_voice_blocked_services:
    name: "Servizi bloccati per la voce"
    description: "Servizi in più che Assist (voce) non può mai chiamare, oltre ai servizi HA bloccati: dominio.servizio o dominio.*."
  ha_voice_exposed_only:
    name: "La voce raggiunge solo le entità esposte"
    description: "Tramite Assist gli strumenti raggiungono solo ciò che Home Assistant espone ad Assist."
  ha_action_log_days:
    name: "Registro azioni (giorni)"
    description: "Per quanto si conserva il registro di tutto ciò che l'assistente ha fatto in Home Assistant."
  mcp_expose:
    name: "Offri HubNEX come server MCP"
    description: "Altri client AI (Claude Code, Claude Desktop…) possono usare gli strumenti di HubNEX su /mcp alla porta dell'add-on, con il token qui sotto."
  mcp_expose_tools:
    name: "Cosa offre /mcp"
    description: "ha = gli strumenti Home Assistant; sessions = le conversazioni di HubNEX (elenco, lettura, chiedere a Jarvis); team = il team (stato, assegnare un compito)."
  mcp_expose_read_only:
    name: "/mcp sola lettura"
    description: "I client esterni ricevono solo gli strumenti che leggono. Disattiva per farli anche agire."
  mcp_token:
    name: "Token /mcp"
    description: "Il token che i client esterni inviano come Bearer. Vuoto = il token HQ."
  mcp_connectors:
    name: "Connettori MCP"
    description: "I programmi del tuo lavoro via MCP (Streamable HTTP), accanto a quelli di agents.yaml (lo stesso nome qui vince). agents, free ed exclude separati da virgole."
  mcp_use_server_instructions:
    name: "Usa le istruzioni dei server"
    description: "Ciò che ogni server MCP dice dei suoi strumenti entra nelle istruzioni dell'assistente."
  mcp_image_results:
    name: "Immagini dagli strumenti"
    description: "Le immagini restituite da uno strumento (fotogrammi…) vengono mostrate all'assistente."
  mcp_tool_search:
    name: "Ricerca strumenti"
    description: "Con molti strumenti dei connettori, offrirne solo alcuni e far cercare il resto all'assistente: meno token per messaggio."
  mcp_max_result_kb:
    name: "Dimensione risultato strumenti (KB)"
    description: "La risposta più lunga di uno strumento dei connettori che l'assistente legge."
network:
  8765/tcp: Dashboard e API (facoltativa, richiede il token HQ)
