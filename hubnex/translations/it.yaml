configuration:
  anthropic_api_key:
    name: Chiave API Anthropic
    description: La chiave per usare Claude (console.anthropic.com). Non serve se usi solo altri fornitori.
  model_jarvis:
    name: Modello di Jarvis
    description: Usato da Jarvis e dagli agenti che non ne indicano uno in agents.yaml. Claude per nome (claude-sonnet-5-5), gli altri con il prefisso del fornitore - openai:gpt-5-mini, ollama:qwen3:14b, compat:nome-modello.
  model_mail:
    name: Modello di Jarvis Mail
    description: Usato dall'agente email e per classificare la posta.
  model_voice:
    name: Modello per i comandi rapidi
    description: La via rapida per le richieste sulla casa (dashboard e Assist). Haiku è il più veloce; le domande complesse passano comunque al modello di Jarvis. Vuoto = niente via rapida.
  anthropic_credit_usd:
    name: Credito Anthropic ($)
    description: Il saldo che vedi su console.anthropic.com (es. 4.90). La dashboard scala da qui il costo stimato di ogni richiesta. Quando ricarichi, scrivi il nuovo saldo e il conteggio riparte. 0 = mostra solo la spesa.
  monthly_budget_usd:
    name: Budget mensile Claude ($)
    description: Avviso nel gruppo Telegram e nelle notifiche quando la spesa del mese arriva all'80% e al 100%. È solo un avviso, HubNEX non si ferma. 0 = nessun avviso.
  openai_api_key:
    name: Chiave API OpenAI
    description: Per i modelli scritti come openai:nome (platform.openai.com).
  openai_base_url:
    name: Indirizzo API OpenAI
    description: Vuoto = quello di OpenAI. Cambialo solo per un servizio che imita OpenAI con la stessa chiave.
  ollama_url:
    name: Indirizzo di Ollama
    description: Per i modelli locali scritti come ollama:nome, es. http://192.168.1.20:11434. Gratis e senza cloud; serve un modello che sappia usare gli strumenti (qwen3, llama3.1, mistral-small).
  compat_base_url:
    name: Indirizzo di un altro servizio compatibile
    description: Per i modelli scritti come compat:nome. Qualsiasi server compatibile con OpenAI, fino a /v1 - LM Studio (http://IP:1234/v1), OpenRouter (https://openrouter.ai/api/v1), Gemini (https://generativelanguage.googleapis.com/v1beta/openai), Mistral, DeepSeek, Groq.
  compat_api_key:
    name: Chiave del servizio compatibile
    description: La chiave di quel servizio; vuota se non la chiede (LM Studio).
  other_price_input:
    name: Prezzo input altri modelli ($ per milione di token)
    description: Per contare la spesa dei modelli openai e compat, come da listino del fornitore. 0 = non contata. I modelli di Ollama sono sempre gratis.
  other_price_output:
    name: Prezzo output altri modelli ($ per milione di token)
    description: Come sopra, per i token di risposta.
  telegram_token_jarvis:
    name: Token bot Jarvis
    description: Da @BotFather. Deve essere un bot che nessun altro programma sta ascoltando.
  telegram_token_mail:
    name: Token bot Jarvis Mail
    description: Il secondo bot del gruppo, quello che parla per la posta.
  allowed_chat_id:
    name: ID del gruppo
    description: Numero negativo, con il segno meno. Scrivi /id nel gruppo per vederlo.
  allowed_user_id:
    name: Il tuo user ID Telegram
    description: I bot obbediscono solo a te.
  telegram_voice_replies:
    name: Risposte vocali su Telegram
    description: Se mandi un vocale a Jarvis, risponde anche a voce (serve ElevenLabs).
  imap_host:
    name: Server IMAP
  imap_port:
    name: Porta IMAP
  smtp_host:
    name: Server SMTP
  smtp_port:
    name: Porta SMTP
  mail_user:
    name: Casella email
  mail_password:
    name: Password email
  mail_from_name:
    name: Nome mittente
    description: Es. "Ing. Mario Rossi - Azienda srl".
  mail_signature:
    name: Firma
    description: Testo semplice (usa \n per andare a capo) oppure HTML incollato dal tuo programma di posta.
  check_interval_minutes:
    name: Controllo posta (minuti)
  notify_min_priority:
    name: Avvisami da priorità
    description: bassa, media (consigliato) o alta.
  mail_ignore:
    name: Mittenti da non segnalare
    description: Separati da virgola. Un indirizzo (offerte@negozio.it), un dominio (@newsletter.it) o una parola dell'indirizzo (noreply). Le loro email restano nella casella, ma niente messaggio su Telegram.
  hq_token:
    name: Token HQ
    description: Password per aprire la dashboard fuori da HA e per l'API (rest_command). Dalla barra laterale non serve.
  elevenlabs_api_key:
    name: Chiave API ElevenLabs
    description: Per la voce di Jarvis e per trascrivere i tuoi vocali.
  elevenlabs_voice_id:
    name: Voce ElevenLabs
  elevenlabs_model:
    name: Modello ElevenLabs
    description: eleven_flash_v2_5 è il più economico e parla italiano.
  voice_tts_entity:
    name: Voce da Home Assistant
    description: In alternativa a ElevenLabs, un motore di sintesi vocale di Home Assistant (es. tts.piper, gratuito e locale, o tts.home_assistant_cloud). Se impostato, ha la precedenza.
  voice_tts_voice:
    name: Voce del motore di Home Assistant
    description: Il nome della voce da usare con il motore qui sopra, per esempio Rinaldo o Diego per Home Assistant Cloud. Vuoto = la voce predefinita. La lingua è quella di Home Assistant.
  language:
    name: Lingua
    description: auto = quella di Home Assistant; it = italiano; en = inglese. Vale per l'assistente, gli agenti, Telegram e i messaggi dell'add-on; la dashboard segue la lingua di chi la apre.
  voice_answers:
    name: Risposte a voce
    description: completa = la voce legge tutta la risposta; riassunto = per le risposte lunghe la voce dice solo il succo in una o due frasi, il testo scritto resta completo (dashboard e vocali Telegram).
  ha_blocked_services:
    name: Servizi HA bloccati
    description: Servizi che Jarvis non può mai chiamare da solo, separati da virgola.
  calendar_entities:
    name: Agende consentite
    description: Entity id separati da virgola (es. calendar.nico, calendar.famiglia) che lo strumento calendar_events può leggere. Vuoto = tutte le agende di Home Assistant. Gli appuntamenti vengono letti dagli agenti a cui dai lo strumento e inviati al fornitore AI.
  install_assist_integration:
    name: Integrazione Assist
    description: Installa e aggiorna l'integrazione che rende Jarvis l'agente di conversazione di Assist (voce da app di HA e speaker).
  non_admin_access:
    name: Utenti non amministratori
    description: "casa: gli utenti di Home Assistant che non sono amministratori vedono solo la Casa (niente assistente, posta, agenti, modifiche alla piantina). completo: vedono tutto come un amministratore."
network:
  8765/tcp: Dashboard e API (facoltativa, richiede il token HQ)
