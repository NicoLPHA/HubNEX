configuration:
  anthropic_api_key:
    name: Anthropic API-sleutel
  model_jarvis:
    name: Model van Jarvis
    description: Wordt gebruikt door Jarvis en door agents die in agents.yaml geen eigen model hebben.
  model_mail:
    name: Model van Jarvis Mail
  model_voice:
    name: Model voor snelle opdrachten
    description: De snelle route voor verzoeken over het huis (dashboard en Assist). Haiku is het snelst; ingewikkelde vragen gaan nog steeds naar het model van Jarvis. Leeg = geen snelle route.
  anthropic_credit_usd:
    name: Anthropic-tegoed ($)
    description: Je saldo op console.anthropic.com. Het dashboard trekt de geschatte kosten van elk verzoek ervan af. Vul na het opwaarderen het nieuwe saldo in. 0 = alleen de uitgaven tonen.
  monthly_budget_usd:
    name: Maandbudget voor Claude ($)
    description: Een waarschuwing in de Telegram-groep en in de meldingen zodra de uitgaven van deze maand 80% en 100% bereiken. Alleen een waarschuwing, HubNEX stopt niet. 0 = geen waarschuwing.
  telegram_token_jarvis:
    name: Bottoken van Jarvis
  telegram_token_mail:
    name: Bottoken van Jarvis Mail
  allowed_chat_id:
    name: Groeps-ID
    description: Negatief getal. Stuur /id in de groep om het te zien.
  allowed_user_id:
    name: Jouw Telegram-gebruikers-ID
  telegram_voice_replies:
    name: Spraakantwoorden op Telegram
  imap_host:
    name: IMAP-server
  imap_port:
    name: IMAP-poort
  smtp_host:
    name: SMTP-server
  smtp_port:
    name: SMTP-poort
  mail_user:
    name: Mailbox
  mail_password:
    name: Wachtwoord van de mailbox
  mail_from_name:
    name: Naam van de afzender
  mail_signature:
    name: Handtekening
  check_interval_minutes:
    name: Mailcontrole (minuten)
  notify_min_priority:
    name: Melden vanaf prioriteit
    description: bassa = laag, media = gemiddeld, alta = hoog.
  mail_ignore:
    name: Afzenders die niet gemeld worden
    description: Gescheiden door komma's. Een adres (aanbiedingen@winkel.nl), een domein (@nieuwsbrief.nl) of een woord uit het adres (noreply). Hun e-mails blijven in de mailbox, maar er komt geen Telegram-bericht.
  hq_token:
    name: HQ-token
    description: Wachtwoord voor het dashboard buiten HA en voor de API. Niet nodig vanuit de zijbalk.
  elevenlabs_api_key:
    name: ElevenLabs API-sleutel
  elevenlabs_voice_id:
    name: ElevenLabs-stem-ID
  elevenlabs_model:
    name: ElevenLabs-model
  voice_tts_entity:
    name: Stem van Home Assistant
    description: In plaats van ElevenLabs een van de TTS-engines van Home Assistant (bijv. tts.piper, gratis en lokaal). Heeft voorrang als dit is ingesteld.
  voice_tts_voice:
    name: Stem van de engine van Home Assistant
    description: De naam van de stem die bij de engine hierboven hoort (bijv. Colette of Fenna). Leeg = de standaardstem. De taal is die van Home Assistant.
  language:
    name: Taal
    description: auto = die van Home Assistant; it = Italiaans; en = Engels; nl = Nederlands. Gebruikt door de assistent, de agents, Telegram en de berichten van de add-on; het dashboard volgt de taal van wie het opent.
  voice_answers:
    name: Gesproken antwoorden
    description: completa = de stem leest het hele antwoord voor; riassunto = bij lange antwoorden zegt de stem alleen de kern in een of twee zinnen, de geschreven tekst blijft compleet.
  ha_blocked_services:
    name: Geblokkeerde HA-diensten
    description: Gescheiden door komma's. Diensten die Jarvis nooit zelf mag aanroepen, bijvoorbeeld sloten ontgrendelen of het alarm uitschakelen. Scripts en automatiseringen vallen hier niet onder, bedenk dat dus bij wat je blootstelt.
  install_assist_integration:
    name: Assist-integratie
    description: Installeer en werk de integratie bij waarmee Jarvis een gespreksagent van Assist wordt.
  non_admin_access:
    name: Gebruikers zonder beheerdersrechten
    description: "casa: Home Assistant-gebruikers die geen beheerder zijn, krijgen alleen de weergave van het huis (geen assistent, e-mail, agents of wijzigingen aan de plattegrond). completo: ze krijgen alles, net als een beheerder."
network:
  8765/tcp: Dashboard en API (optioneel, vereist het HQ-token)
